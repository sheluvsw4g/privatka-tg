name: Build Telegram iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Telegram (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install Bazel
        uses: bazelbuild/setup-bazelisk@v1
        with:
          bazelisk-version: v1.25.0

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/Library/Caches/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('**/MODULE.bazel.lock', '**/BUILD.bazel', '**/*.bzl') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build Telegram (Simulator)
        run: |
          python3 build-system/Make/Make.py build \
            --configuration=release_arm64 \
            --target=Telegram/Telegram \
            --ios_simulator

      - name: Find built app
        run: |
          find . -name "Telegram.app" -type d 2>/dev/null | head -5
          APP_PATH=$(find . -name "Telegram.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Upload Telegram.app (Simulator)
        if: env.APP_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Simulator
          path: ${{ env.APP_PATH }}
          retention-days: 7

      # Optional: Build for device (requires codesigning setup)
      # - name: Build Telegram (Device)
      #   run: |
      #     python3 build-system/Make/Make.py build \
      #       --configuration=release_arm64 \
      #       --target=Telegram/Telegram
name: Build Telegram iOS IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (optional override)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build IPA on macOS
    runs-on: macos-15

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Xcode Environment
        run: |
          echo "Xcode installations found:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Prepare canonical workspace
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv /Users/Shared/$(basename "$GITHUB_WORKSPACE") /Users/Shared/telegram-ios
          mkdir -p /Users/Shared/telegram-bazel-cache

      - name: Cache Bazel Build Cache
        uses: actions/cache@v4
        with:
          path: /Users/Shared/telegram-bazel-cache
          key: ${{ runner.os }}-telegram-bazel-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-telegram-bazel-

      - name: Build Telegram iOS App via Bazel
        run: |
          set -e
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          CACHE_DIR="/Users/Shared/telegram-bazel-cache"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          APP_VERSION="$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj.get("app","13.1.1"));')"
          COMMIT_COUNT="$(git rev-list --count HEAD 2>/dev/null || echo 1)"
          CALCULATED_BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          INPUT_BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
          else
            BUILD_NUMBER="$CALCULATED_BUILD_NUMBER"
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          find bazel-out bazel-bin -name "Telegram.ipa" -exec cp {} "$OUTPUT_PATH/" \; 2>/dev/null || true

          if [ ! -f "$OUTPUT_PATH/Telegram.ipa" ]; then
            for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
              if [ -f "$f" ]; then
                cp "$f" "$OUTPUT_PATH/"
              fi
            done
          fi

          ls -la "$OUTPUT_PATH/"

          mkdir -p build/DSYMs
          find bazel-out bazel-bin -name "*.dSYM" -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true
          if [ -d "build/DSYMs" ] && [ "$(ls -A build/DSYMs 2>/dev/null)" ]; then
            zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null || true
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-iOS-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Upload DSYMs Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Telegram-iOS-DSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Release build of Telegram iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
            Built via GitHub Actions Bazel build system.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
